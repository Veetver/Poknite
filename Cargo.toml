[workspace]
members = ["crates/protocol", "crates/server", "crates/client", "crates/desktop"]
default-members = ["crates/server", "crates/client"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
poknite-protocol = { path = "crates/protocol" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
