[package]
name = "poknite-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
poknite-protocol.workspace = true
poknite-client = { path = "../client" }
fltk = { version = "=1.5.22", default-features = false, features = ["no-pango", "no-images", "use-ninja"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[[bin]]
name = "poknite"
path = "src/main.rs"
