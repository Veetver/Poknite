name: Verify Poknite
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libdbus-1-dev libx11-dev libxext-dev libxft-dev libxrender-dev libxfixes-dev libxcursor-dev libxinerama-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/test_release.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - run: python3 tools/check_sizes.py
      - run: python3 tools/client_smoke.py
      - run: python3 tools/tls_smoke.py --binary target/release/poknited
      - run: python3 tools/v2_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu24
          if-no-files-found: error
          path: |
            target/release/poknited
            target/release/poknite
            deploy/
            docs/
            README.md
            CONTRIBUTING.md
            LICENSE
            THIRD_PARTY_NOTICES.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p poknite-client -p poknite-protocol --locked
      - run: cargo build -p poknite-desktop --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            target/release/poknite.exe
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.txt
            deploy/CPP_RUNTIME_NOTICES.txt
            docs/desktop.md
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew --no-daemon test lint assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/README.md
            android/THIRD_PARTY_NOTICES.txt
            LICENSE
